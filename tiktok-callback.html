<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login — QAYIM</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1a1a2e;
            background: #fafafa;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: #16697a; text-decoration: none; }
        a:hover { text-decoration: underline; }
        header {
            background: #1a1a2e;
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        header .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; }
        header nav a { color: #c9d6df; margin-left: 1.25rem; font-size: 0.95rem; }
        header nav a:hover { color: #fff; text-decoration: none; }
        .callback-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .callback-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .callback-card .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .callback-card h1 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }
        .callback-card p {
            color: #555;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .callback-card .status-success { color: #16697a; }
        .callback-card .status-error { color: #c0392b; }
        .callback-card .home-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #16697a;
            font-weight: 600;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            color: #777;
            border-top: 1px solid #e0e0e0;
        }
        footer a { margin: 0 0.5rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">QAYIM</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
    </nav>
</header>

<div class="callback-container">
    <div class="callback-card" id="callbackCard">
        <div class="icon" id="statusIcon">&#9889;</div>
        <h1 id="statusTitle">Processing...</h1>
        <p id="statusMessage">Please wait while we complete your login.</p>
        <a href="index.html" class="home-link" id="homeLink" style="display:none;">Return to QAYIM</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 QAYIM. All rights reserved.</p>
    <p>
        <a href="privacy.html">Privacy Policy</a> &middot;
        <a href="terms.html">Terms of Service</a>
    </p>
</footer>

<script>
(function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var error = params.get('error');
    var state = params.get('state');

    var icon = document.getElementById('statusIcon');
    var title = document.getElementById('statusTitle');
    var message = document.getElementById('statusMessage');
    var homeLink = document.getElementById('homeLink');

    if (code) {
        icon.textContent = '\u2714';
        title.textContent = 'Login Successful';
        title.className = 'status-success';
        message.textContent = 'You can return to the QAYIM app. This window can be closed.';
        homeLink.style.display = 'inline-block';
    } else if (error) {
        icon.textContent = '\u2716';
        title.textContent = 'Login Cancelled';
        title.className = 'status-error';
        message.textContent = 'The login was not completed. You can close this window and try again from the app.';
        homeLink.style.display = 'inline-block';
    } else {
        icon.textContent = '\u2139';
        title.textContent = 'QAYIM Login';
        title.className = '';
        message.textContent = 'This page handles TikTok login for the QAYIM app. Please start the login process from within the app.';
        homeLink.style.display = 'inline-block';
    }
})();
</script>

</body>
</html>
